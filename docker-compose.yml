version: "3.9"

networks:
  pulsarops-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  elasticsearch_data:

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pulsarops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - pulsarops-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application services ────────────────────────────────────────────────────
  monitor-service:
    build: ./services/monitor-service
    restart: unless-stopped
    ports:
      - "8011:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL}
      LATENCY_THRESHOLD_MS: ${LATENCY_THRESHOLD_MS}
    networks:
      - pulsarops-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  alert-service:
    build: ./services/alert-service
    restart: unless-stopped
    ports:
      - "8012:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MONITOR_SERVICE_URL: http://monitor-service:8000
    networks:
      - pulsarops-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      monitor-service:
        condition: service_started

  api-gateway:
    build: ./services/api-gateway
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MONITOR_SERVICE_URL: http://monitor-service:8000
      ALERT_SERVICE_URL: http://alert-service:8000
      CACHE_TTL: ${CACHE_TTL}
      RATE_LIMIT_REQUESTS: 60
      RATE_LIMIT_WINDOW: 60
    networks:
      - pulsarops-net
    depends_on:
      redis:
        condition: service_healthy
      monitor-service:
        condition: service_started
      alert-service:
        condition: service_started

  # ── Observability ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - pulsarops-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - pulsarops-net

  # ── ELK Stack ───────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - pulsarops-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    ports:
      - "5044:5044"
      - "5000:5000"
    volumes:
      - ./monitoring/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - pulsarops-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - pulsarops-net
