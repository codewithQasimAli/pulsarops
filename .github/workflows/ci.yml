name: PulsarOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint api-gateway
        run: flake8 services/api-gateway/main.py --max-line-length=100 --ignore=E501,W503 --statistics

      - name: Lint monitor-service
        run: flake8 services/monitor-service/main.py --max-line-length=100 --ignore=E501,W503 --statistics

      - name: Lint alert-service
        run: flake8 services/alert-service/main.py --max-line-length=100 --ignore=E501,W503 --statistics

  security-scan:
    name: Security Scan — Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit on all services
        run: bandit -r services/ -ll --exit-zero

      - name: Generate Bandit JSON report
        run: bandit -r services/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  build-and-scan:
    name: Build Docker Images + Trivy Scan
    runs-on: ubuntu-latest
    needs: [ lint, security-scan ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build api-gateway image
        run: docker build -t pulsarops-api-gateway:${{ github.sha }} services/api-gateway

      - name: Build monitor-service image
        run: docker build -t pulsarops-monitor-service:${{ github.sha }} services/monitor-service

      - name: Build alert-service image
        run: docker build -t pulsarops-alert-service:${{ github.sha }} services/alert-service

      - name: Trivy scan — api-gateway
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pulsarops-api-gateway:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy scan — monitor-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pulsarops-monitor-service:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy scan — alert-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pulsarops-alert-service:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Prepare environment
        run: cp .env.example .env

      - name: Smoke test — all services respond
        run: |
          docker compose up -d
          sleep 30
          curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8010/health
          curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8011/health
          curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8012/health
          docker compose down
