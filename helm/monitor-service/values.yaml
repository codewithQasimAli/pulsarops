replicaCount: 1

image:
  repository: pulsarops-monitor-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

env:
  DATABASE_URL: "postgresql://pulsarops:pulsarops@postgres:5432/pulsarops"
  MONITOR_INTERVAL: "30"
  LATENCY_THRESHOLD_MS: "2000"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 10
