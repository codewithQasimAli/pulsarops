apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pulsarops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pulsarops
            - name: POSTGRES_USER
              value: pulsarops
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsarops-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pulsarops
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
